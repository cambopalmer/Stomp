server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API → api container
  location /api/ {
    proxy_pass http://api:3000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # sitemap/robots come from the API
  location = /sitemap.xml { proxy_pass http://api:3000/api/sitemap.xml; }
  location = /robots.txt  { proxy_pass http://api:3000/api/robots.txt; }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
