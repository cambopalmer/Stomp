<title>STOMP Architecture Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap"
/>

<style>
  /* ─────────────────────────────────────────────────────────────
     STOMP Architecture Map — a click-through C4 model drawn in the
     conventional C4 notation (c4model.com): solid boxes with a
     name, a [Type: Technology] line and a description; labelled
     arrows carrying "[Technology]"; a dashed boundary per scope.
     Diagram palette = the C4 blue family. The app chrome (nav,
     rail) carries STOMP's own indigo (design-system/stomp).
     ───────────────────────────────────────────────────────────── */

  :root {
    --ground: #f4f6f9;
    --surface: #ffffff;
    --canvas: #eef1f5;
    --ink: #16202e;
    --ink-soft: #37455b;
    --muted: #5c6879;
    --hair: #dfe4ec;
    --hair-strong: #c6cedb;

    --indigo: #4f46e5;
    --indigo-soft: #eceafe;

    /* C4 element fills (white text on all) */
    --c4-person: #0a4a86;
    --c4-system: #0f5aa0;
    --c4-container: #1470bf;
    --c4-component: #3f83c6;
    --c4-external: #8a8a8a;
    --c4-boundary: #9aa4b2;
    --c4-store: #1470bf;

    --edge: #6a7180;
    --gate-auth: #b45309;
    --gate-authz: #0f8a5f;

    --shadow: 0 1px 2px rgba(16, 32, 46, 0.08), 0 10px 26px -14px rgba(16, 32, 46, 0.22);

    --font-sans: "Plus Jakarta Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0a0f18;
      --surface: #111a2b;
      --canvas: #0f1626;
      --ink: #e9eef6;
      --ink-soft: #c3cddd;
      --muted: #8b98ac;
      --hair: #212f45;
      --hair-strong: #2e3d59;

      --indigo: #8b93f8;
      --indigo-soft: #1b2446;

      --c4-person: #2f6fae;
      --c4-system: #2c73b4;
      --c4-container: #2f81c8;
      --c4-component: #4a8fce;
      --c4-external: #7c7c7c;
      --c4-boundary: #5a6474;
      --c4-store: #2f81c8;

      --edge: #7f8798;
      --gate-auth: #e0973b;
      --gate-authz: #37c98c;

      --shadow: 0 1px 2px rgba(0, 0, 0, 0.45), 0 12px 30px -16px rgba(0, 0, 0, 0.7);
    }
  }

  :root[data-theme="dark"] {
    --ground: #0a0f18;
    --surface: #111a2b;
    --canvas: #0f1626;
    --ink: #e9eef6;
    --ink-soft: #c3cddd;
    --muted: #8b98ac;
    --hair: #212f45;
    --hair-strong: #2e3d59;
    --indigo: #8b93f8;
    --indigo-soft: #1b2446;
    --c4-person: #2f6fae;
    --c4-system: #2c73b4;
    --c4-container: #2f81c8;
    --c4-component: #4a8fce;
    --c4-external: #7c7c7c;
    --c4-boundary: #5a6474;
    --c4-store: #2f81c8;
    --edge: #7f8798;
    --gate-auth: #e0973b;
    --gate-authz: #37c98c;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.45), 0 12px 30px -16px rgba(0, 0, 0, 0.7);
  }

  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }
  a {
    color: var(--indigo);
  }
  :where(a, button, [tabindex]):focus-visible {
    outline: 2px solid var(--indigo);
    outline-offset: 2px;
    border-radius: 4px;
  }

  .app {
    display: grid;
    grid-template-columns: 232px minmax(0, 1fr) 322px;
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas:
      "brand topbar topbar"
      "nav   canvas  detail";
    height: 100dvh;
    min-height: 560px;
  }

  .brand {
    grid-area: brand;
    padding: 18px 18px 14px;
    border-right: 1px solid var(--hair);
    border-bottom: 1px solid var(--hair);
  }
  .brand h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .brand p {
    margin: 2px 0 0;
    font-size: 11.5px;
    color: var(--muted);
    font-family: var(--font-mono);
  }

  .topbar {
    grid-area: topbar;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--hair);
    overflow-x: auto;
  }
  .crumbs {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 13px;
    white-space: nowrap;
  }
  .crumbs button {
    background: none;
    border: 0;
    padding: 4px 7px;
    border-radius: 6px;
    font: inherit;
    color: var(--muted);
    cursor: pointer;
  }
  .crumbs button:hover {
    background: var(--indigo-soft);
    color: var(--ink);
  }
  .crumbs button[aria-current="page"] {
    color: var(--ink);
    font-weight: 700;
  }
  .crumbs .sep {
    color: var(--hair-strong);
  }
  .topbar .spacer {
    flex: 1;
  }
  .topbar .hint {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }
  .topbar .hint kbd {
    font-family: var(--font-mono);
    font-size: 11px;
    background: var(--surface);
    border: 1px solid var(--hair-strong);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 5px;
  }

  .nav {
    grid-area: nav;
    border-right: 1px solid var(--hair);
    padding: 14px 12px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .ladder-label,
  .legend h2 {
    margin: 0 0 8px 6px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .ladder {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .ladder button {
    display: flex;
    flex-direction: column;
    gap: 1px;
    width: 100%;
    text-align: left;
    background: none;
    border: 0;
    border-radius: 8px;
    padding: 8px 10px;
    font: inherit;
    color: var(--ink-soft);
    cursor: pointer;
    position: relative;
  }
  .ladder button .lv {
    font-size: 10px;
    font-family: var(--font-mono);
    color: var(--muted);
  }
  .ladder button .nm {
    font-size: 13px;
    font-weight: 600;
  }
  .ladder button:hover {
    background: var(--indigo-soft);
  }
  .ladder button[aria-current="true"] {
    background: var(--indigo);
    color: #fff;
  }
  .ladder button[aria-current="true"] .lv,
  .ladder button[aria-current="true"] .nm {
    color: #fff;
  }
  .ladder button[data-depth="1"] {
    margin-left: 14px;
  }
  .ladder button[data-depth="2"] {
    margin-left: 28px;
  }
  .ladder button[data-depth]:not([data-depth="0"])::before {
    content: "";
    position: absolute;
    left: -8px;
    top: 0;
    bottom: 50%;
    width: 1px;
    background: var(--hair-strong);
  }
  .ladder button[data-depth]:not([data-depth="0"])::after {
    content: "";
    position: absolute;
    left: -8px;
    top: 50%;
    width: 6px;
    height: 1px;
    background: var(--hair-strong);
  }

  .legend dl {
    margin: 0;
    display: grid;
    grid-template-columns: 22px 1fr;
    gap: 8px;
    align-items: center;
    font-size: 11.5px;
  }
  .legend .sw {
    width: 22px;
    height: 15px;
    border-radius: 3px;
  }
  .legend .sw.person {
    background: var(--c4-person);
  }
  .legend .sw.system {
    background: var(--c4-system);
  }
  .legend .sw.container {
    background: var(--c4-container);
  }
  .legend .sw.component {
    background: var(--c4-component);
  }
  .legend .sw.external {
    background: var(--c4-external);
  }
  .legend .sw.planned {
    background: var(--c4-external);
    border: 1.5px dashed var(--ink);
  }
  .legend dd {
    margin: 0;
    color: var(--ink-soft);
  }

  .canvas {
    grid-area: canvas;
    overflow: auto;
    background: var(--ground);
    padding: 26px;
  }
  .stage {
    min-height: 100%;
  }
  .stage-head h2 {
    margin: 0;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: -0.015em;
    text-wrap: balance;
  }
  .stage-head p {
    margin: 3px 0 16px;
    font-size: 13px;
    color: var(--muted);
    max-width: 66ch;
  }
  .diagram-wrap {
    background: var(--canvas);
    border: 1px solid var(--hair);
    border-radius: 10px;
    box-shadow: var(--shadow);
    padding: 18px;
    display: inline-block;
    max-width: 100%;
    overflow-x: auto;
  }
  svg.diagram {
    display: block;
    max-width: 100%;
    height: auto;
  }
  @media (prefers-reduced-motion: no-preference) {
    .stage {
      animation: fade 0.16s ease-out;
    }
    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
    }
  }

  /* ── C4 boxes (styled from the page, never inside <svg>) ── */
  .node {
    cursor: pointer;
  }
  .node .shape {
    stroke: rgba(0, 0, 0, 0.28);
    stroke-width: 1;
  }
  .node.n-person .shape {
    fill: var(--c4-person);
  }
  .node.n-system .shape {
    fill: var(--c4-system);
  }
  .node.n-container .shape,
  .node.n-store .shape {
    fill: var(--c4-container);
  }
  .node.n-component .shape {
    fill: var(--c4-component);
  }
  .node.n-external .shape {
    fill: var(--c4-external);
  }
  .node.s-planned .shape {
    fill: var(--c4-external);
    stroke: var(--ink);
    stroke-width: 1.4;
    stroke-dasharray: 5 3;
  }
  .node .t-name {
    fill: #fff;
    font-family: var(--font-sans);
    font-weight: 700;
    font-size: 13.5px;
  }
  .node .t-type {
    fill: rgba(255, 255, 255, 0.82);
    font-family: var(--font-sans);
    font-size: 10px;
  }
  .node .t-desc {
    fill: rgba(255, 255, 255, 0.92);
    font-family: var(--font-sans);
    font-size: 10.5px;
  }
  .node .t-drill {
    fill: #fff;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 500;
  }
  .node:hover .shape {
    stroke: var(--indigo);
    stroke-width: 2;
  }
  .node.is-selected .shape {
    stroke: var(--indigo);
    stroke-width: 3;
    stroke-dasharray: none;
  }

  .boundary {
    fill: none;
    stroke: var(--c4-boundary);
    stroke-width: 1.4;
    stroke-dasharray: 7 5;
  }
  .boundary-label {
    fill: var(--muted);
    font-family: var(--font-sans);
    font-weight: 600;
    font-size: 11px;
  }

  .edge {
    fill: none;
    stroke: var(--edge);
    stroke-width: 1.5;
  }
  .edge.e-planned,
  .edge.e-optional {
    stroke-dasharray: 6 4;
  }
  .arrow {
    fill: var(--edge);
  }
  .elabel {
    fill: var(--ink-soft);
    font-family: var(--font-sans);
    font-size: 10.5px;
  }
  .elabel-tech {
    fill: var(--muted);
    font-family: var(--font-mono);
    font-size: 9.5px;
  }
  .elabel-bg {
    fill: var(--canvas);
    opacity: 0.94;
  }

  /* sequence (code level) */
  .lifeline {
    stroke: var(--hair-strong);
    stroke-width: 1.3;
    stroke-dasharray: 3 4;
  }
  .msg {
    stroke: var(--ink-soft);
    stroke-width: 1.5;
    fill: none;
  }
  .msg.g-auth {
    stroke: var(--gate-auth);
  }
  .msg.g-authz {
    stroke: var(--gate-authz);
  }
  .msg-arrow {
    fill: var(--ink-soft);
  }
  .msg-arrow.g-auth {
    fill: var(--gate-auth);
  }
  .msg-arrow.g-authz {
    fill: var(--gate-authz);
  }
  .mlabel {
    fill: var(--ink-soft);
    font-family: var(--font-mono);
    font-size: 10.5px;
  }
  .mnote {
    fill: var(--muted);
    font-family: var(--font-sans);
    font-size: 10px;
    font-style: italic;
  }
  .gate-band {
    fill: var(--gate-auth);
    opacity: 0.09;
  }
  .gate-band.authz {
    fill: var(--gate-authz);
  }
  .gate-tag {
    fill: var(--muted);
    font-family: var(--font-sans);
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .detail {
    grid-area: detail;
    border-left: 1px solid var(--hair);
    overflow-y: auto;
    padding: 20px 20px 40px;
  }
  .detail .empty {
    color: var(--muted);
    font-size: 13px;
    margin-top: 40px;
    text-align: center;
  }
  .detail .kind-tag {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 999px;
    color: #fff;
    background: var(--c4-container);
  }
  .detail .kind-tag.person {
    background: var(--c4-person);
  }
  .detail .kind-tag.system {
    background: var(--c4-system);
  }
  .detail .kind-tag.external {
    background: var(--c4-external);
  }
  .detail .kind-tag.component {
    background: var(--c4-component);
  }
  .detail h3 {
    margin: 12px 0 2px;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .detail .stereo {
    margin: 0 0 14px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
  }
  .detail p.blurb {
    font-size: 13.5px;
    color: var(--ink-soft);
    margin: 0 0 16px;
  }
  .detail .meta {
    border-top: 1px solid var(--hair);
    padding-top: 12px;
    margin-top: 4px;
  }
  .detail .meta h4 {
    margin: 0 0 6px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .detail .meta ul {
    margin: 0 0 14px;
    padding: 0;
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }
  .detail .meta ul.stack {
    flex-direction: column;
    gap: 3px;
  }
  .detail .meta .chip {
    font-family: var(--font-mono);
    font-size: 11px;
    background: var(--ground);
    border: 1px solid var(--hair);
    border-radius: 5px;
    padding: 2px 6px;
    color: var(--ink-soft);
  }
  .detail .drill-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    margin-top: 6px;
    padding: 10px 14px;
    border-radius: 8px;
    border: 0;
    background: var(--indigo);
    color: #fff;
    font: inherit;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }
  .detail .drill-btn:hover {
    filter: brightness(1.06);
  }
  .detail .up-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
    padding: 7px 10px;
    border-radius: 7px;
    border: 1px solid var(--hair-strong);
    background: var(--surface);
    color: var(--ink-soft);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .detail .up-btn:hover {
    border-color: var(--indigo);
    color: var(--ink);
  }

  @media (max-width: 1100px) {
    .app {
      grid-template-columns: 210px minmax(0, 1fr);
      grid-template-areas:
        "brand topbar"
        "nav   canvas"
        "nav   detail";
      grid-template-rows: auto minmax(0, 1fr) auto;
      height: auto;
      min-height: 100dvh;
    }
    .detail {
      border-left: 0;
      border-top: 1px solid var(--hair);
      max-height: 48vh;
    }
  }
  @media (max-width: 720px) {
    .app {
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas: "brand" "topbar" "nav" "canvas" "detail";
    }
    .nav {
      border-right: 0;
      border-bottom: 1px solid var(--hair);
    }
  }
</style>

<div class="app">
  <div class="brand">
    <h1>STOMP Architecture Map</h1>
    <p>C4 model · v0.4</p>
  </div>

  <div class="topbar">
    <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
    <span class="spacer"></span>
    <span class="hint">Click a box marked <kbd>↳ open</kbd> to zoom in · <kbd>Esc</kbd> zooms out</span>
  </div>

  <div class="nav">
    <div>
      <p class="ladder-label">The C4 ladder</p>
      <div class="ladder" id="ladder"></div>
    </div>
    <div class="legend">
      <h2>Notation</h2>
      <dl>
        <span class="sw person"></span><dd>Person</dd>
        <span class="sw system"></span><dd>Software system (in focus)</dd>
        <span class="sw container"></span><dd>Container</dd>
        <span class="sw component"></span><dd>Component</dd>
        <span class="sw external"></span><dd>External system</dd>
        <span class="sw planned"></span><dd>Planned — Phase 4</dd>
      </dl>
    </div>
  </div>

  <div class="canvas" id="canvas"></div>

  <aside class="detail" id="detail" aria-live="polite">
    <p class="empty">Select any box to see what it is, what it does, and where it lives in the repo.</p>
  </aside>
</div>

<script>
  "use strict";

  /* ───────────────────────── the model ─────────────────────────
     Each level is a set of nodes placed on a (layer, lane) grid and
     a set of labelled edges. `drill` names the level a node opens.
     `desc` is the short text drawn inside the box; `blurb` is the
     fuller text shown in the side rail. Facts as of v0.4.0.
     ──────────────────────────────────────────────────────────── */

  const LEVELS = {
    context: {
      crumb: "Context",
      ladder: { lv: "Level 1", nm: "System Context", depth: 0 },
      title: "Level 1 — System Context",
      lead: "The big picture: STOMP as a single box, and the people and external systems it interacts with.",
      box: 244,
      layerGap: 178,
      laneGap: 280,
      descMax: 3,
      nodes: [
        {
          id: "member", kind: "person", layer: 0, lane: 1, name: "Hub member",
          type: "Person",
          desc: "Shares a household hub with 1–2 others.",
          blurb:
            "One of the 2–3 people who share a household hub. Uses STOMP to run their calendar, todos, triage inbox and learn library, and to share items with the others.",
        },
        {
          id: "stomp", kind: "system", layer: 1, lane: 1, name: "STOMP", drill: "containers",
          type: "Software System",
          desc: "Personal + shared hub for calendar, todos, an incoming triage inbox and a learn library, grouped by projects inside optional workspaces.",
          blurb:
            "Self-hostable personal + shared hub. Home screen of tiles per section plus a “hot & relevant” sidebar (due-today / overdue / high-priority).",
          tech: ["TypeScript", "self-hosted", "Docker"],
        },
        {
          id: "google-id", kind: "external", state: "optional", layer: 2, lane: 0,
          name: "Google Identity", type: "External System",
          desc: "OAuth 2.0 / OpenID Connect. Optional single sign-on.",
          blurb:
            "When GOOGLE_CLIENT_ID/SECRET are set, STOMP redirects here and reads the verified profile from the userinfo endpoint, linking it to an account by email. Email/password auth works with or without it.",
          tech: ["@fastify/oauth2", "openidconnect.googleapis.com"],
        },
        {
          id: "workspace-apis", kind: "external", state: "planned", layer: 2, lane: 1,
          name: "Gmail & Google Calendar", type: "External System · planned",
          desc: "Read-only inbound pull of mail and calendar events. Phase 4 — designed, not built.",
          blurb:
            "Mail becomes incoming items; calendar events become read-only events. Tokens per user in integration_accounts; a scheduled sync writes sync_log.",
          tech: ["Gmail API", "Google Calendar API", "integration_accounts", "sync_log"],
        },
        {
          id: "otel", kind: "external", state: "optional", layer: 2, lane: 2,
          name: "OpenTelemetry Collector", type: "External System · optional",
          desc: "Receives request traces when OTEL_MODE=otlp.",
          blurb:
            "Any OTLP collector — SigNoz, Grafana Tempo, Jaeger. Off by default with zero overhead.",
          tech: ["OTLP/HTTP :4318", "@opentelemetry/sdk-node"],
        },
      ],
      edges: [
        { from: "member", to: "stomp", label: "Uses", tech: "HTTPS" },

  const ORDER = ["context", "containers", "api", "web", "flow"];
  const PARENTS = { context: null, containers: "context", api: "containers", web: "containers", flow: "api" };

  let current = "context";
  let selected = null;

  /* ───────────────────────── helpers ─────────────────────── */
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) =>
    String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const mdInline = (s) =>
    esc(s).replace(/`([^`]+)`/g, '<code style="font-family:var(--font-mono);font-size:0.92em">$1</code>');

  const M = 58; // canvas margin

  function wrap(text, maxChars) {
    const words = String(text).split(/\s+/);
    const lines = [];
    let cur = "";
    for (const w of words) {
      if (cur && (cur + " " + w).length > maxChars) {
        lines.push(cur);
        cur = w;
      } else {
        cur = cur ? cur + " " + w : w;
      }
    }
    if (cur) lines.push(cur);
    return lines;
  }

  /** Full geometry + wrapped text for one C4 node. */
  function geom(level, n) {
    const w = level.box;
    const nameLines = wrap(n.name, Math.floor((w - 24) / 7.4));
    const descLines = wrap(n.desc || "", Math.floor((w - 22) / 5.4)).slice(0, level.descMax || 3);
    const head = n.kind === "person" ? 20 : 0;
    const bodyH =
      14 + nameLines.length * 17 + 5 + (n.type ? 13 : 0) + (descLines.length ? 8 + descLines.length * 13 : 0) + 14;
    const cx = M + n.lane * level.laneGap + w / 2;
    const top = M + n.layer * level.layerGap + head;
    return {
      x: cx - w / 2, y: top, w, h: bodyH, cx,
      top, bottom: top + bodyH, headCy: top - 1, headR: 11,
      nameLines, descLines,
    };
  }

  function canvasSize(level) {
    let W = 0;
    let H = 0;
    for (const n of level.nodes) {
      const g = geom(level, n);
      W = Math.max(W, g.x + g.w);
      H = Math.max(H, g.bottom);
    }
    if (level.boundary) {
      H += 18;
      W += 14;
    }
    return [W + M, H + M];
  }

  function nodeById(level, id) {
    return level.nodes.find((n) => n.id === id);
  }

  /* ───────────────────────── render: C4 diagram ──────────── */
  function renderC4(level) {
    const [W, H] = canvasSize(level);
    const geoms = new Map(level.nodes.map((n) => [n.id, geom(level, n)]));
    const parts = [
      `<svg class="diagram" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMinYMin meet" role="img" aria-label="${esc(
        level.title,
      )}">`,
      `<defs><marker id="c4arw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
         <path d="M0 0 L10 5 L0 10 z" class="arrow"/></marker></defs>`,
    ];

    // boundary box
    if (level.boundary) {
      const gs = level.boundary.ids.map((id) => geoms.get(id)).filter(Boolean);
      const bx0 = Math.min(...gs.map((g) => g.x)) - 22;
      const by0 = Math.min(...gs.map((g) => g.top - (g.headCy ? 21 : 0))) - 30;
      const bx1 = Math.max(...gs.map((g) => g.x + g.w)) + 22;
      const by1 = Math.max(...gs.map((g) => g.bottom)) + 20;
      parts.push(`<rect class="boundary" x="${bx0}" y="${by0}" width="${bx1 - bx0}" height="${by1 - by0}" rx="12"/>`);
      parts.push(`<text class="boundary-label" x="${bx0 + 14}" y="${by0 + 18}">${esc(level.boundary.label)}</text>`);
    }

    // edges — pre-count fan-out so parallel jogs get staggered
    const fanTotal = {};
    for (const e of level.edges) {
      const a = nodeById(level, e.from);
      const b = nodeById(level, e.to);
      if (!a || !b || a.layer === b.layer) continue;
      if (Math.abs(geoms.get(a.id).cx - geoms.get(b.id).cx) < 2) continue;
      const k = e.from + (b.layer > a.layer ? "d" : "u");
      fanTotal[k] = (fanTotal[k] || 0) + 1;
    }

    const fan = {};
    for (const e of level.edges) {
      const a = nodeById(level, e.from);
      const b = nodeById(level, e.to);
      if (!a || !b) continue;
      const ga = geoms.get(a.id);
      const gb = geoms.get(b.id);
      const cls = e.state ? "edge e-" + e.state : "edge";

      let x1, y1, x2, y2, lx, ly, anchor;
      if (a.layer === b.layer) {
        const lf = ga.cx <= gb.cx;
        x1 = lf ? ga.x + ga.w : ga.x;
        x2 = lf ? gb.x : gb.x + gb.w;
        y1 = y2 = (ga.top + ga.bottom + gb.top + gb.bottom) / 4;
        lx = (x1 + x2) / 2;
        ly = Math.max(ga.bottom, gb.bottom) + 20;
        anchor = "middle";
        parts.push(`<path class="${cls}" d="M ${x1} ${y1} L ${x2} ${y2}" marker-end="url(#c4arw)"/>`);
      } else {
        const down = b.layer > a.layer;
        x1 = ga.cx;
        x2 = gb.cx;
        y1 = down ? ga.bottom : ga.top;
        y2 = down ? gb.top - (gb.headCy ? 21 : 0) : gb.bottom;
        const straight = Math.abs(x1 - x2) < 2;
        const key = e.from + (down ? "d" : "u");
        const total = fanTotal[key] || 1;
        const i = straight ? 0 : (fan[key] = (fan[key] || 0) + 1) - 1;
        const gap = level.layerGap - ga.h - (a.kind === "person" ? 20 : 0);
        const step = total > 1 ? Math.max(20, (gap - 40) / (total - 1)) : 0;
        const off = Math.max(14, Math.min(18 + i * step, gap - 12, Math.abs(y2 - y1) - 10));
        const jy = down ? y1 + off : y1 - off;
        const d = straight
          ? `M ${x1} ${y1} L ${x2} ${y2}`
          : `M ${x1} ${y1} L ${x1} ${jy} L ${x2} ${jy} L ${x2} ${y2}`;
        parts.push(`<path class="${cls}" d="${d}" marker-end="url(#c4arw)"/>`);
        // label: on the jog for lone edges; near the target's vertical drop
        // for fan-outs, so parallel labels separate horizontally
        const rowCount = (e.label ? wrap(e.label, 26).length : 0) + (e.tech ? 1 : 0);
        if (straight) {
          lx = x1 + 8;
          ly = down ? jy + 4 : jy - 16;
          anchor = "start";
        } else if (total > 1) {
          // sits just above the target box, on its own vertical drop
          lx = x2;
          ly = (down ? y2 : y2 + rowCount * 12 + 14) - 12 - rowCount * 12;
          anchor = "middle";
        } else {
          lx = (x1 + x2) / 2;
          ly = down ? jy + 4 : jy - 16;
          anchor = "middle";
        }
      }

      if (e.label || e.tech) {
        const L1 = e.label ? wrap(e.label, 26) : [];
        const rows = [...L1.map((t) => ({ t, cls: "elabel" }))];
        if (e.tech) rows.push({ t: "[" + e.tech + "]", cls: "elabel-tech" });
        const wdt = Math.max(...rows.map((r) => r.t.length)) * 5.6 + 10;
        const bx = anchor === "start" ? lx - 5 : lx - wdt / 2;
        parts.push(
          `<rect class="elabel-bg" x="${bx}" y="${ly - 10}" width="${wdt}" height="${rows.length * 12 + 4}" rx="3"/>`,
        );
        rows.forEach((r, i) =>
          parts.push(
            `<text class="${r.cls}" x="${lx}" y="${ly + i * 12}" text-anchor="${anchor}">${esc(r.t)}</text>`,
          ),
        );
      }
    }

    // nodes
    for (const n of level.nodes) {
      const g = geoms.get(n.id);
      const cls = ["node", "n-" + n.kind, n.state ? "s-" + n.state : "", n.id === selected ? "is-selected" : ""]
        .filter(Boolean)
        .join(" ");
      parts.push(
        `<g class="${cls}" data-node="${n.id}" tabindex="0" role="button" aria-label="${esc(
          n.name,
        )}, ${esc(n.type || "")}${n.drill ? ", opens the next level" : ""}">`,
      );

      if (n.kind === "person") {
        parts.push(`<circle class="shape" cx="${g.cx}" cy="${g.headCy}" r="${g.headR}"/>`);
      }
      if (n.kind === "store") {
        // cylinder
        const rx = g.w / 2;
        const ry = 9;
        parts.push(
          `<path class="shape" d="M ${g.x} ${g.y + ry} a ${rx} ${ry} 0 0 1 ${g.w} 0 v ${g.h - 2 * ry} a ${rx} ${ry} 0 0 1 ${-g.w} 0 z"/>`,
          `<path class="shape" style="fill:rgba(255,255,255,0.12)" d="M ${g.x} ${g.y + ry} a ${rx} ${ry} 0 0 0 ${g.w} 0"/>`,
        );
      } else {
        parts.push(`<rect class="shape" x="${g.x}" y="${g.y}" width="${g.w}" height="${g.h}" rx="4"/>`);
      }

      let ty = g.y + 20 + (n.kind === "store" ? 4 : 0);
      g.nameLines.forEach((ln, i) => {
        const tail = n.drill && i === g.nameLines.length - 1 ? ' <tspan class="t-drill">↳ open</tspan>' : "";
        parts.push(
          `<text class="t-name" x="${g.cx}" y="${ty + i * 17}" text-anchor="middle">${esc(ln)}${tail}</text>`,
        );
      });
      ty += g.nameLines.length * 17 + 1;
      if (n.type) {
        parts.push(`<text class="t-type" x="${g.cx}" y="${ty}" text-anchor="middle">[${esc(n.type)}]</text>`);
        ty += 8;
      }
      g.descLines.forEach((ln, i) =>
        parts.push(
          `<text class="t-desc" x="${g.cx}" y="${ty + 13 + i * 13}" text-anchor="middle">${esc(ln)}</text>`,
        ),
      );

      parts.push(`</g>`);
    }

    parts.push(`</svg>`);
    return parts.join("");
  }

  /* ───────────────────────── render: sequence ────────────── */
  function renderSequence(level) {
    const seq = level.sequence;
    const colGap = 238;
    const left = 100;
    const top = 86;
    const rowGap = 46;
    const W = left + (seq.actors.length - 1) * colGap + left;
    const H = top + 26 + seq.messages.length * rowGap + 40;

    const parts = [
      `<svg class="diagram" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMinYMin meet" role="img" aria-label="${esc(
        level.title,
      )}">`,
      `<defs>
        <marker id="sq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="msg-arrow"/></marker>
        <marker id="sq-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="msg-arrow g-auth"/></marker>
        <marker id="sq-z" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="msg-arrow g-authz"/></marker>
      </defs>`,
    ];

    const cx = {};
    seq.actors.forEach((a, i) => (cx[a.id] = left + i * colGap));

    // gate bands
    const rowY = (i) => top + 30 + i * rowGap;
    const authRows = seq.messages.map((m, i) => (m.gate === "auth" ? i : -1)).filter((i) => i >= 0);
    const authzRows = seq.messages.map((m, i) => (m.gate === "authz" ? i : -1)).filter((i) => i >= 0);
    const band = (rows, klass, tag) => {
      if (!rows.length) return;
      const y0 = rowY(rows[0]) - 20;
      const y1 = rowY(rows[rows.length - 1]) + 12;
      parts.push(`<rect class="gate-band ${klass}" x="${left - 40}" y="${y0}" width="${W - left - 20}" height="${y1 - y0}" rx="6"/>`);
      parts.push(`<text class="gate-tag" x="${left - 34}" y="${y0 + 13}">${tag}</text>`);
    };
    band(authRows, "", "authentication");
    band(authzRows, "authz", "authorization");

    // lifelines + actor boxes
    seq.actors.forEach((a) => {
      const x = cx[a.id];
      parts.push(`<line class="lifeline" x1="${x}" y1="${top + 2}" x2="${x}" y2="${H - 26}"/>`);
      parts.push(
        `<g class="node n-component" data-node="seq:${a.id}" tabindex="0" role="button" aria-label="${esc(a.name)}">`,
      );
      parts.push(`<rect class="shape" x="${x - 74}" y="26" width="148" height="34" rx="4"/>`);
      parts.push(
        `<text class="t-name" x="${x}" y="47" text-anchor="middle" style="font-size:11px">${esc(a.name)}</text>`,
      );
      parts.push(`</g>`);
    });

    // messages
    seq.messages.forEach((m, i) => {
      const y = rowY(i);
      const x1 = cx[m.from];
      const x2 = cx[m.to];
      const g = m.gate === "auth" ? " g-auth" : m.gate === "authz" ? " g-authz" : "";
      const mk = m.gate === "auth" ? "url(#sq-a)" : m.gate === "authz" ? "url(#sq-z)" : "url(#sq)";
      const dash = m.dashed ? ' stroke-dasharray="4 3"' : "";
      if (m.self) {
        parts.push(`<path class="msg${g}" d="M ${x1} ${y} h 30 v 15 h -30" marker-end="${mk}"${dash}/>`);
        parts.push(`<text class="mlabel" x="${x1 + 40}" y="${y + 12}">${esc(m.label)}</text>`);
      } else {
        const dir = x2 > x1 ? 1 : -1;
        parts.push(
          `<line class="msg${g}" x1="${x1 + dir * 5}" y1="${y}" x2="${x2 - dir * 6}" y2="${y}" marker-end="${mk}"${dash}/>`,
        );
        parts.push(
          `<text class="mlabel" x="${Math.min(x1, x2) + 6}" y="${y - 6}">${esc(m.label)}</text>`,
        );
      }
      if (m.note)
        parts.push(`<text class="mnote" x="${Math.min(x1, x2) + 6}" y="${y + 13}">${esc(m.note)}</text>`);
    });

    parts.push(`</svg>`);
    return parts.join("");
  }

  /* ───────────────────────── paint ───────────────────────── */
  function paint() {
    const level = LEVELS[current];
    const canvas = $("#canvas");
    canvas.innerHTML = `
      <div class="stage">
        <div class="stage-head">
          <h2>${esc(level.title)}</h2>
          <p>${mdInline(level.lead)}</p>
        </div>
        <div class="diagram-wrap">${level.sequence ? renderSequence(level) : renderC4(level)}</div>
      </div>`;

    canvas.querySelectorAll("[data-node]").forEach((gEl) => {
      const raw = gEl.getAttribute("data-node");
      const id = raw.startsWith("seq:") ? raw.slice(4) : raw;
      gEl.addEventListener("click", () => selectNode(id));
      gEl.addEventListener("keydown", (ev) => {
        if (ev.key === "Enter" || ev.key === " ") {
          ev.preventDefault();
          selectNode(id);
        }
      });
    });

    paintLadder();
    paintCrumbs();
    paintDetail();
  }

  function paintLadder() {
    const box = $("#ladder");
    box.innerHTML = ORDER.map((key) => {
      const L = LEVELS[key];
      return `<button data-key="${key}" data-depth="${L.ladder.depth}" aria-current="${key === current}">
        <span class="lv">${esc(L.ladder.lv)}</span><span class="nm">${esc(L.ladder.nm)}</span>
      </button>`;
    }).join("");
    box.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => go(b.dataset.key, null)));
  }

  function paintCrumbs() {
    const chain = [current];
    let walk = current;
    while (PARENTS[walk]) {
      walk = PARENTS[walk];
      chain.unshift(walk);
    }
    const el = $("#crumbs");
    el.innerHTML = chain
      .map((key, i) => {
        const last = i === chain.length - 1;
        return `<button data-key="${key}" ${last ? 'aria-current="page"' : ""}>${esc(LEVELS[key].crumb)}</button>${
          last ? "" : '<span class="sep">›</span>'
        }`;
      })
      .join("");
    el.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => go(b.dataset.key, null)));
  }

  function paintDetail() {
    const el = $("#detail");
    const level = LEVELS[current];
    let node = null;
    if (selected) {
      node = (level.nodes || []).find((n) => n.id === selected);
      if (!node && level.sequence) {
        const a = level.sequence.actors.find((x) => x.id === selected);
        if (a) node = seqActorDetail(a);
      }
    }
    if (!node) {
      el.innerHTML = `<p class="empty">Select any box to see what it is, what it does, and where it lives in the repo.</p>`;
      return;
    }

    const kc =
      node.kind === "person"
        ? "person"
        : node.kind === "system"
          ? "system"
          : node.kind === "external"
            ? "external"
            : node.kind === "component"
              ? "component"
              : "";
    const kt =
      node.state === "planned"
        ? "planned"
        : node.kind === "person"
          ? "person"
          : node.kind === "external"
            ? "external system"
            : node.kind === "system"
              ? "software system"
              : node.kind === "store"
                ? "data store"
                : node.kind === "component"
                  ? "component"
                  : "container";

    let html = `<span class="kind-tag ${kc}">${esc(kt)}</span>
      <h3>${esc(node.name)}</h3>
      <p class="stereo">[${esc(node.type || "")}]</p>
      <p class="blurb">${mdInline([node.desc, node.blurb].filter(Boolean).join(" "))}</p>`;

    if (node.tech && node.tech.length) {
      html += `<div class="meta"><h4>Technology</h4><ul>${node.tech
        .map((t) => `<li class="chip">${esc(t)}</li>`)
        .join("")}</ul></div>`;
    }
    if (node.paths && node.paths.length) {
      html += `<div class="meta"><h4>In the repo</h4><ul class="stack">${node.paths
        .map((p) => `<li class="chip">${esc(p)}</li>`)
        .join("")}</ul></div>`;
    }
    if (node.drill) {
      html += `<button class="drill-btn" data-drill="${node.drill}">Zoom into ${esc(LEVELS[node.drill].crumb)} →</button>`;
    }
    if (PARENTS[current]) {
      html += `<button class="up-btn" data-up="1">↑ Back to ${esc(LEVELS[PARENTS[current]].crumb)}</button>`;
    }

    el.innerHTML = html;
    const d = el.querySelector("[data-drill]");
    if (d) d.addEventListener("click", () => go(d.dataset.drill, selected));
    const u = el.querySelector("[data-up]");
    if (u) u.addEventListener("click", stepUp);
  }

  function seqActorDetail(a) {
    const map = {
      browser: {
        name: "Browser", kind: "container", type: "the SPA, client-side",
        desc: "Sends the PATCH with the httpOnly stomp_session cookie attached automatically (fetch uses credentials: “include”).",
      },
      nginx: { name: "nginx", kind: "container", type: "web container", desc: "Reverse-proxies /api to the api container on :3000." },
      authctx: {
        name: "authContext", kind: "component", type: "Fastify onRequest hook",
        desc: "Unsigns the cookie, resolves the session, sets request.ctx. 401s if there is no valid session and the route is not public.",
        paths: ["apps/api/src/plugins/authContext.ts"],
      },
      route: {
        name: "routes/index.ts", kind: "component", type: "HTTP layer",
        desc: "Zod-validates the :id param and the JSON body, calls the service, serializes the response against the response schema.",
        paths: ["apps/api/src/routes/index.ts"],
      },
      svc: {
        name: "services/todos.ts", kind: "component", type: "logic + authorization",
        desc: "updateTodo(db, ctx, id, input): loads the todo, checks edit access, applies the patch, writes an activity_log row, returns the updated todo.",
        paths: ["apps/api/src/services/todos.ts"],
      },
      access: {
        name: "services/access.ts", kind: "component", type: "the visibility model",
        desc: "projectAccess(userId, projectId) → { canView, canEdit } from the stronger of the workspace and project role. The service throws 403 if canEdit is false.",
        paths: ["apps/api/src/services/access.ts"],
      },
      db: {
        name: "Drizzle / SQLite", kind: "store", type: "data access",
        desc: "Parameterized UPDATE and INSERT via Drizzle against the libSQL / SQLite file.",
      },
    };
    return map[a.id] || { name: a.name, kind: "component", type: "", desc: "" };
  }

  /* ───────────────────────── nav ─────────────────────────── */
  function selectNode(id) {
    selected = id;
    syncHash();
    document.querySelectorAll("#canvas .node").forEach((gEl) => {
      const raw = gEl.getAttribute("data-node") || "";
      const nid = raw.startsWith("seq:") ? raw.slice(4) : raw;
      gEl.classList.toggle("is-selected", nid === id);
    });
    paintDetail();
  }

  function go(key, fromNode) {
    if (!LEVELS[key]) return;
    current = key;
    const L = LEVELS[key];
    selected = fromNode && (L.nodes || []).some((n) => n.id === fromNode) ? fromNode : null;
    syncHash();
    paint();
    $("#canvas").scrollTo({ top: 0, left: 0 });
  }

  function stepUp() {
    if (PARENTS[current]) go(PARENTS[current], null);
  }

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") stepUp();
  });

  /* ───────────────────────── hash routing ────────────────── */
  function syncHash() {
    const h = `#/${current}${selected ? "/" + encodeURIComponent(selected) : ""}`;
    if (location.hash !== h) history.replaceState(null, "", h);
  }
  function readHash() {
    const m = location.hash.match(/^#\/([a-z]+)(?:\/(.+))?$/);
    if (m && LEVELS[m[1]]) {
      current = m[1];
      selected = m[2] ? decodeURIComponent(m[2]) : null;
    }
  }
  window.addEventListener("hashchange", () => {
    readHash();
    paint();
  });

  readHash();
  paint();
</script>
